<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <!-- Background -->
  <rect x="0" y="0" width="390" height="844" fill="#0f5132" />

  <!-- Language chooser -->
  <rect x="20" y="20" width="180" height="32" rx="16" fill="#fff" opacity="0.9" />
  <text x="30" y="42" font-family="Arial" font-size="14" fill="#0f5132">Urdu | English | Pashto</text>

  <!-- Member card top area -->
  <rect x="20" y="70" width="350" height="180" rx="16" fill="#e9f5ee" />
  <circle cx="60" cy="130" r="36" fill="#c3d5ca" />
  <text x="110" y="110" font-family="Arial" font-size="16" fill="#0f5132">Member Name</text>
  <text x="110" y="130" font-family="Arial" font-size="13" fill="#0f5132">Designation</text>
  <text x="110" y="150" font-family="Arial" font-size="12" fill="#0f5132">Issued: 2025-01-01</text>
  <text x="110" y="168" font-family="Arial" font-size="12" fill="#0f5132">Expiry: 2026-01-01</text>
  <!-- QR block -->
  <rect x="270" y="95" width="80" height="80" rx="8" fill="#0f5132" />
  <text x="280" y="140" font-family="Arial" font-size="12" fill="#fff">QR</text>
  <!-- Settings/QR details button -->
  <circle cx="350" cy="80" r="10" fill="#b08a2e" />

  <!-- New Member button -->
  <rect x="20" y="270" width="160" height="56" rx="28" fill="#b08a2e" />
  <text x="35" y="303" font-family="Arial" font-size="14" fill="#fff">👤➕ New Member</text>

  <!-- Existing Member button -->
  <rect x="210" y="270" width="160" height="56" rx="28" fill="#b08a2e" />
  <text x="225" y="303" font-family="Arial" font-size="14" fill="#fff">🆔 Existing</text>

  <!-- Downloads block -->
  <rect x="20" y="346" width="160" height="140" rx="16" fill="#fff" opacity="0.9" />
  <text x="30" y="370" font-family="Arial" font-size="14" fill="#0f5132">Downloads</text>
  <text x="30" y="392" font-family="Arial" font-size="12" fill="#0f5132">• Manshoor (PDF)</text>
  <text x="30" y="412" font-family="Arial" font-size="12" fill="#0f5132">• Candidate list</text>
  <text x="30" y="432" font-family="Arial" font-size="12" fill="#0f5132">• Other PDFs</text>

  <!-- Contact block -->
  <rect x="210" y="346" width="160" height="140" rx="16" fill="#fff" opacity="0.9" />
  <text x="220" y="370" font-family="Arial" font-size="14" fill="#0f5132">Contact</text>
  <text x="220" y="392" font-family="Arial" font-size="12" fill="#0f5132">• Social links</text>
  <text x="220" y="412" font-family="Arial" font-size="12" fill="#0f5132">• Phone</text>
  <text x="220" y="432" font-family="Arial" font-size="12" fill="#0f5132">• Map location</text>

  <!-- Note: No balance anywhere -->
  <text x="20" y="520" font-family="Arial" font-size="12" fill="#fff">No balance displayed</text>
</svg>
