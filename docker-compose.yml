version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: pcsm
      POSTGRES_PASSWORD: pcsm
      POSTGRES_DB: pcsm
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pcsm"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: pcsm
      DB_USER: pcsm
      DB_PASSWORD: pcsm
      API_SECRET: change_me_secret
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["uvicorn", "fastapi_app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  db_data:
